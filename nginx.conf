server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML, CSS y JS viajan comprimidos (~80% menos); las imágenes WebP/JPG ya lo están
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fotos de producto: se repiten entre catálogo, ficha y relacionados.
    # ponytail: 1 día sin hashes en el nombre; subir a immutable si algún día se versionan
    location ~* ^/(images|images_opt|theme/images)/ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
